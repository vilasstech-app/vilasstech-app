<!doctype html><html lang="es"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;background:#101827;color:#eee;margin:0;padding:24px}main{max-width:620px;margin:auto}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border-radius:8px;font:inherit}textarea{min-height:200px}button{background:#2563eb;color:white;border:0}button:disabled{opacity:.5}</style></head><body><main><h1>VILASSTECH</h1><h2>Oficina virtual · Prueba de correo</h2><button onclick="google.script.run.withSuccessHandler(r=>estado.textContent='Conexión autorizada. Cuota restante: '+r.cuota).withFailureHandler(e=>estado.textContent=e.message).verificarConexion()">Verificar conexión (sin enviar)</button><form id="f"><label>Destinatario<input id="correo" type="email" required></label><label>Asunto<input id="asunto" required></label><label>Mensaje<textarea id="cuerpo" required></textarea></label><button id="enviar">Revisar y aprobar envío</button></form><p id="estado" role="status"></p></main><script>const f=document.getElementById('f'),estado=document.getElementById('estado'),enviar=document.getElementById('enviar');f.onsubmit=e=>{e.preventDefault();const d={correo:document.getElementById('correo').value,asunto:document.getElementById('asunto').value,cuerpo:document.getElementById('cuerpo').value,aprobado:true};if(!confirm('¿Autorizar este correo a '+d.correo+'?\n\n'+d.asunto+'\n\n'+d.cuerpo))return;enviar.disabled=true;google.script.run.withSuccessHandler(r=>{estado.textContent=r;enviar.disabled=false;f.reset()}).withFailureHandler(e=>{estado.textContent=e.message;enviar.disabled=false}).enviarAprobado(d)};</script></body></html>
